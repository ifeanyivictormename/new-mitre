<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alumni Registration – MITRE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f8fafc; }
    .hero { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; padding: 2.5rem 0; }
    .form-card { max-width: 640px; margin: -2rem auto 3rem; border: none; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  </style>
</head>
<body>
  <div class="hero text-center">
    <div class="container">
      <i class="bi bi-people-fill fs-1"></i>
      <h2 class="mt-2 mb-1">Alumni Registration</h2>
      <p class="mb-0 opacity-75">Stay connected with the MITRE community</p>
    </div>
  </div>

  <div class="container">
    <div class="card form-card">
      <div class="card-body p-4 p-md-5">
        <div id="alert" class="alert d-none"></div>
        <form id="alumniForm">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Full Name *</label>
              <input type="text" class="form-control" id="full_name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" id="phone" placeholder="08012345678">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="email">
            </div>
            <div class="col-md-6">
              <label class="form-label">Gender</label>
              <select class="form-select" id="gender">
                <option value="">—</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Graduation Year</label>
              <input type="number" class="form-control" id="graduation_year" min="1990" max="2030">
            </div>
            <div class="col-md-6">
              <label class="form-label">Current Occupation</label>
              <input type="text" class="form-control" id="current_occupation">
            </div>
            <div class="col-md-6">
              <label class="form-label">Current Location</label>
              <input type="text" class="form-control" id="current_location">
            </div>
            <div class="col-12">
              <label class="form-label">Zone (optional)</label>
              <select class="form-select" id="zone_id">
                <option value="">— Select Zone —</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Short Bio</label>
              <textarea class="form-control" id="bio" rows="3"></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100 mt-4" id="btnSubmit">
            Register as Alumni
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script>
    const API = (window.API_BASE || '').replace(/\/$/, '');
    // Load zones
    fetch(API + '/zones/public.php').then(r => r.json()).then(d => {
      if (d.success) {
        const sel = document.getElementById('zone_id');
        d.data.forEach(z => {
          const o = document.createElement('option');
          o.value = z.id; o.textContent = z.name;
          sel.appendChild(o);
        });
      }
    });

    document.getElementById('alumniForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const alert = document.getElementById('alert');
      btn.disabled = true;
      alert.classList.add('d-none');

      const body = {
        full_name: document.getElementById('full_name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        email: document.getElementById('email').value.trim(),
        gender: document.getElementById('gender').value,
        graduation_year: document.getElementById('graduation_year').value,
        current_occupation: document.getElementById('current_occupation').value.trim(),
        current_location: document.getElementById('current_location').value.trim(),
        zone_id: document.getElementById('zone_id').value || null,
        bio: document.getElementById('bio').value.trim()
      };

      try {
        const res = await fetch(API + '/alumni/register.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const raw = await res.text();
        let data;
        try {
          data = JSON.parse(raw);
        } catch (_) {
          throw new Error(`Server returned non-JSON response (HTTP ${res.status}).`);
        }
        if (!res.ok) {
          throw new Error(data.message || `Request failed (HTTP ${res.status})`);
        }
        if (data.success) {
          alert.className = 'alert alert-success';
          alert.textContent = data.message;
          alert.classList.remove('d-none');
          e.target.reset();
        } else {
          throw new Error(data.message || 'Registration failed');
        }
      } catch (err) {
        alert.className = 'alert alert-danger';
        alert.textContent = err.message;
        alert.classList.remove('d-none');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
