<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Login – MITRE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e40af, #3b82f6); }
    .card { border: none; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,.2); max-width: 400px; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <i class="bi bi-person-circle fs-1 text-primary"></i>
        <h4 class="mt-2">Student Login</h4>
        <p class="text-muted small">Enter your registered phone number</p>
      </div>
      <div id="alert" class="alert d-none"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-control form-control-lg" id="phone" required placeholder="08012345678">
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100" id="btnLogin">Login</button>
      </form>
      <p class="text-center text-muted small mt-3 mb-0">
        Not yet admitted? <a href="/registration">Apply here</a>
      </p>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script>
    const API = (window.API_BASE || '').replace(/\/$/, '');
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const alert = document.getElementById('alert');
      btn.disabled = true;
      alert.classList.add('d-none');

      try {
        const res = await fetch(API + '/auth/student_login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ phone: document.getElementById('phone').value.trim() })
        });
        const data = await res.json();
        if (data.success) {
          location.href = 'index.html';
        } else {
          throw new Error(data.message || 'Login failed');
        }
      } catch (err) {
        alert.className = 'alert alert-danger';
        alert.textContent = err.message;
        alert.classList.remove('d-none');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
