<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Portal | MITRE</title>
  <link href="../assets/css/bootstrap.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f1f5f9; }
    .navbar { box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .stat-card { border: none; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#"><i class="bi bi-mortarboard-fill text-primary me-1"></i> MITRE</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-muted small" id="studentName">—</span>
        <button class="btn btn-outline-secondary rounded-5 btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-4 col-lg-2">
        <div class="card stat-card h-100">
          <div class="card-body">
            <div class="text-muted small">Reg. No.</div>
            <div class="fs-6 fw-semibold text-break" id="studentRegNo">—</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-2">
        <div class="card stat-card h-100">
          <div class="card-body">
            <div class="text-muted small">Set</div>
            <div class="fs-5 fw-semibold" id="studentSet">—</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-2">
        <div class="card stat-card h-100">
          <div class="card-body">
            <div class="text-muted small">Conclave</div>
            <div class="fs-5 fw-semibold" id="studentConclave">—</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-2">
        <div class="card stat-card h-100">
          <div class="card-body">
            <div class="text-muted small">Status</div>
            <div class="fs-5 fw-semibold" id="studentStatus">—</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-2">
        <div class="card stat-card h-100">
          <div class="card-body">
            <div class="text-muted small">Zone</div>
            <div class="fs-6 fw-semibold" id="studentZone">—</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white fw-semibold">My Results</div>
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th>Conclave</th>
              <th>Attendance</th>
              <th>Summary</th>
              <th>Short</th>
              <th>Long</th>
              <th>Term</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="resultsBody">
            <tr><td colspan="7" class="text-center text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script>
    const API = (window.API_BASE || '').replace(/\/$/, '');

    async function init() {
      try {
        const res = await fetch(API + '/auth/me.php', { credentials: 'include' });
        const data = await res.json();
        if (!data.success || data.data.user.type !== 'student') {
          location.href = 'login.html';
          return;
        }
        const u = data.data.user;
        document.getElementById('studentName').textContent = u.full_name;
        document.getElementById('studentStatus').textContent = u.status || '—';
        document.getElementById('studentSet').textContent =
          u.set_number != null ? ('Set ' + u.set_number) : '—';
        document.getElementById('studentRegNo').textContent = u.reg_no || '—';
        document.getElementById('studentZone').textContent = data.data.current_zone?.name || u.zone_name || '—';

        // Load results
        const rRes = await fetch(API + '/assessments/results.php', { credentials: 'include' });
        const rData = await rRes.json();
        const rows = rData.data || [];

        const setCurrentConclave = Number(u.set_current_sequence || 0);
        const currentConclave = Number(u.current_conclave || 0);
        let conclaveText = '—';

        if (setCurrentConclave > 0) {
          conclaveText = 'Conclave ' + setCurrentConclave;
        } else if (currentConclave > 0) {
          conclaveText = 'Conclave ' + currentConclave;
        } else if (rows.length) {
          const latest = rows.reduce((best, row) => {
            const bestYear = Number(best?.year || 0);
            const rowYear = Number(row?.year || 0);
            if (rowYear > bestYear) return row;
            if (rowYear < bestYear) return best;

            const bestSeq = Number(best?.sequence || 0);
            const rowSeq = Number(row?.sequence || 0);
            return rowSeq >= bestSeq ? row : best;
          }, rows[0]);

          const seq = Number(latest?.sequence || 0);
          conclaveText = seq > 0 ? ('Conclave ' + seq) : '—';
        }

        document.getElementById('studentConclave').textContent = conclaveText;

        document.getElementById('resultsBody').innerHTML = rows.length
          ? rows.map(r => `
            <tr>
              <td>${r.sequence != null ? ('Conclave ' + r.sequence) : '—'}</td>
              <td>${r.attendance_score}</td>
              <td>${r.summary_score}</td>
              <td>${r.short_paper_score}</td>
              <td>${r.long_paper_score}</td>
              <td>${r.term_paper_score}</td>
              <td><strong>${r.total_score}</strong></td>
            </tr>
          `).join('')
          : '<tr><td colspan="7" class="text-center text-muted">No results yet</td></tr>';
      } catch {
        location.href = 'login.html';
      }
    }

    async function logout() {
      await fetch(API + '/auth/student_logout.php', { method: 'POST', credentials: 'include' });
      location.href = 'login.html';
    }

    init();
  </script>
</body>
</html>
