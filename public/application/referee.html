<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITRE Referee Form</title>
  <link rel="stylesheet" href="../assets/css/bootstrap.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="application-page">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../../index.html">MITRE</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#refereeNav" aria-controls="refereeNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="refereeNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Application</a></li>
          <li class="nav-item"><a class="nav-link" href="../../index.html#criteria">Admission Criteria</a></li>
          <li class="nav-item"><a class="nav-link" href="../../index.html#contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="portal-hero text-center">
    <div class="container">
      <i class="bi bi-person-check fs-1"></i>
      <h1 class="h2 mt-2 mb-1">Referee's Form</h1>
      <p class="mb-0 opacity-75">MITRE application reference</p>
    </div>
  </header>

  <main class="container application-content">
    <div class="card form-card">
      <div class="card-body p-4 p-md-5">
        <div id="alert" class="alert d-none" role="alert"></div>
        <p id="candidate" class="fw-semibold"></p>
        <form id="refereeForm" class="d-none">
          <div class="mb-3"><label class="form-label" for="ref_name">Your Full Name *</label><input class="form-control" id="ref_name" required></div>
          <div class="mb-3"><label class="form-label" for="ref_phone">Your WhatsApp Phone *</label><input class="form-control" id="ref_phone" type="tel" placeholder="08012345678" required></div>
          <div class="mb-3"><label class="form-label" for="ref_email">Your Email</label><input class="form-control" id="ref_email" type="email"></div>
          <div class="mb-3"><label class="form-label" for="ref_address">Your Residential Address *</label><textarea class="form-control" id="ref_address" rows="2" required></textarea></div>
          <div class="mb-3"><label class="form-label" for="ref_duration">How long have you known the candidate? *</label><input class="form-control" id="ref_duration" required></div>
          <div class="mb-3"><label class="form-label" for="ref_info">Why should the candidate attend MITRE?</label><textarea class="form-control" id="ref_info" rows="4"></textarea></div>
          <button type="submit" class="btn btn-primary w-100" id="submitButton">Submit Referee Details</button>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <div class="container text-center">
      <p>&copy; 2026 MITRE. All rights reserved.</p>
      <p id="contact">Need help? <a href="https://api.whatsapp.com/send?phone=2348034530726&text=Hi,%20please%20i%20need%20help%20registering%20for%20MITRE!" target="_blank" rel="noopener">Contact Support</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script>
    const API = (window.API_BASE || '').replace(/\/$/, '');
    const token = new URLSearchParams(window.location.search).get('token') || '';
    const alertBox = document.getElementById('alert');
    const form = document.getElementById('refereeForm');

    function showMessage(message, type = 'success') {
      alertBox.className = `alert alert-${type}`;
      alertBox.textContent = message;
    }

    async function request(path, options = {}) {
      const response = await fetch(API + path, { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.success) throw new Error(data.message || `Request failed (HTTP ${response.status})`);
      return data.data;
    }

    if (!/^[a-f0-9]{64}$/.test(token)) {
      showMessage('This referee link is invalid.', 'danger');
    } else {
      request(`/students/application.php?action=referee&token=${encodeURIComponent(token)}`).then(result => {
        document.getElementById('candidate').textContent = `You are providing a reference for ${result.candidate_name}.`;
        form.classList.remove('d-none');
      }).catch(error => showMessage(error.message, 'danger'));
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!form.checkValidity()) { form.reportValidity(); return; }
      const button = document.getElementById('submitButton');
      button.disabled = true;
      const body = {
        action: 'referee_submit',
        referee_token: token,
        ref_name: document.getElementById('ref_name').value.trim(),
        ref_phone: document.getElementById('ref_phone').value.trim(),
        ref_email: document.getElementById('ref_email').value.trim(),
        ref_address: document.getElementById('ref_address').value.trim(),
        ref_duration: document.getElementById('ref_duration').value.trim(),
        ref_info: document.getElementById('ref_info').value.trim()
      };
      try {
        await request('/students/application.php', { method: 'POST', body: JSON.stringify(body) });
        form.classList.add('d-none');
        showMessage('Thank you. Your referee details have been submitted successfully.');
      } catch (error) {
        showMessage(error.message, 'danger');
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
