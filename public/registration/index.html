<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Application | MITRE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f8fafc; }
    .hero { background: linear-gradient(135deg, #1e40af, #3b82f6); color: #fff; padding: 2.5rem 0; }
    .form-card { max-width: 720px; margin: -2rem auto 3rem; border: none; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  </style>
</head>
<body>
  <div class="hero text-center">
    <div class="container">
      <i class="bi bi-pencil-square fs-1"></i>
      <h2 class="mt-2 mb-1">Student Application</h2>
      <p class="mb-0 opacity-75">Apply to join Minister Improvement and Training Retreat (3-year programme)</p>
    </div>
  </div>

  <div class="container">
    <div class="card form-card">
      <div class="card-body p-4 p-md-5">
        <form id="regForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">First Name *</label>
              <input type="text" class="form-control" id="first_name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Last Name *</label>
              <input type="text" class="form-control" id="last_name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Other Names</label>
              <input type="text" class="form-control" id="other_names">
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone Number *</label>
              <input type="tel" class="form-control" id="phone" required placeholder="08012345678">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email (optional)</label>
              <input type="email" class="form-control" id="email">
            </div>
            <div class="col-md-6">
              <label class="form-label">Gender</label>
              <select class="form-select" id="gender">
                <option value="">—</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Date of Birth</label>
              <input type="date" class="form-control" id="date_of_birth">
            </div>
            <div class="col-md-6">
              <label class="form-label">Zone / Branch *</label>
              <select class="form-select" id="zone_id" required>
                <option value="">— Select Zone —</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" id="address">
            </div>
            <div class="col-md-6">
              <label class="form-label">State of Origin</label>
              <input type="text" class="form-control" id="state_of_origin">
            </div>
            <div class="col-md-6">
              <label class="form-label">LGA</label>
              <input type="text" class="form-control" id="lga">
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100 mt-4" id="btnSubmit">
            Submit Application
          </button>
        </form>
      </div>
    </div>
  </div>

  <div id="toast-container" style="position:fixed;bottom:20px;right:20px;z-index:2000"></div>

  <script src="../assets/js/config.js"></script>
  <script>
    const API = (window.API_BASE || '').replace(/\/$/, '');
    const qs = new URLSearchParams(window.location.search);
    const preselectZoneId = qs.get('zone_id');

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container') || document.body;
      const id = 'toast-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
      const bg = type === 'error' ? 'bg-danger' : 'bg-success';
      const html = `
        <div id="${id}" class="toast align-items-center text-white ${bg} border-0 show" role="alert" style="min-width:280px">
          <div class="d-flex">
            <div class="toast-body">${message}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="Close"></button>
          </div>
        </div>`;
      container.insertAdjacentHTML('beforeend', html);
      const el = document.getElementById(id);
      el?.querySelector('.btn-close')?.addEventListener('click', () => el.remove());
      setTimeout(() => el?.remove(), 4500);
    }

    fetch(API + '/zones/public.php').then(r => r.json()).then(d => {
      if (d.success) {
        const sel = document.getElementById('zone_id');
        d.data.forEach(z => {
          const o = document.createElement('option');
          o.value = z.id; o.textContent = z.name + ' (' + z.code + ')';
          if (preselectZoneId && String(z.id) === String(preselectZoneId)) {
            o.selected = true;
          }
          sel.appendChild(o);
        });
      }
    });

    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;

      const body = {
        first_name: document.getElementById('first_name').value.trim(),
        last_name: document.getElementById('last_name').value.trim(),
        other_names: document.getElementById('other_names').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        email: document.getElementById('email').value.trim(),
        gender: document.getElementById('gender').value,
        date_of_birth: document.getElementById('date_of_birth').value,
        zone_id: parseInt(document.getElementById('zone_id').value),
        address: document.getElementById('address').value.trim(),
        state_of_origin: document.getElementById('state_of_origin').value.trim(),
        lga: document.getElementById('lga').value.trim()
      };

      try {
        const res = await fetch(API + '/students/register.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const raw = await res.text();
        let data;
        try {
          data = JSON.parse(raw);
        } catch (_) {
          throw new Error(`Server returned non-JSON response (HTTP ${res.status}).`);
        }
        if (!res.ok) {
          throw new Error(data.message || `Request failed (HTTP ${res.status})`);
        }
        if (data.success) {
          showToast(data.message || 'Application submitted successfully');
          e.target.reset();
        } else {
          throw new Error(data.message || 'Application failed');
        }
      } catch (err) {
        showToast(err.message || 'Registration failed', 'error');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
