<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login – MITRE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/admin.css" rel="stylesheet">
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="bi bi-shield-lock fs-1 text-primary"></i>
          <h4 class="mt-2 mb-1">Admin Login</h4>
          <p class="text-muted small">Minister Improvement and Training Retreat</p>
        </div>

        <div id="alert" class="alert d-none" role="alert"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control form-control-lg" id="email" required placeholder="admin@example.com" value="">
          </div>
          <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" class="form-control form-control-lg" id="password" required placeholder="••••••••" value="">
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100" id="btnLogin">
            <span class="spinner-border spinner-border-sm d-none" id="spinner"></span>
            Sign In
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="assets/js/admin.js"></script>
  <script>
    // Redirect if already logged in
    Admin.checkAuth().then(ok => { if (ok) location.href = 'index.html'; });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const spinner = document.getElementById('spinner');
      const alert = document.getElementById('alert');

      btn.disabled = true;
      spinner.classList.remove('d-none');
      alert.classList.add('d-none');

      try {
        await Admin.login(
          document.getElementById('email').value.trim(),
          document.getElementById('password').value
        );
        location.href = 'index.html';
      } catch (err) {
        alert.textContent = err.message || 'Login failed';
        alert.classList.remove('d-none', 'alert-success');
        alert.classList.add('alert-danger');
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
